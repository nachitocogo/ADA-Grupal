<!-- ═══════════ ADA GRUPAL · TARJETA · copiar desde acá ═══════════
     Reemplazar URL_DE_ADA_GRUPAL por el link publicado de ADA Grupal.
     Todo el CSS va con prefijo .adag- para no pisar estilos de la página. -->
<style>
  .adag-card { --adag-gold: #c9a227; --adag-gold-hi: #ebcb6a; --adag-cream: #f3ead6; --adag-sand: #bfb39e;
    display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap;
    box-sizing: border-box; width: 100%; padding: 22px 24px; border-radius: 16px; text-decoration: none;
    background: linear-gradient(180deg, #16130f, #0f0d0a); border: 1px solid rgba(201,162,39,.45);
    font-family: 'Manrope', 'Helvetica Neue', Arial, sans-serif; color: var(--adag-cream);
    transition: border-color .2s ease, transform .2s ease; }
  .adag-card:hover { border-color: var(--adag-gold); transform: translateY(-2px); text-decoration: none; }
  .adag-card:focus-visible { outline: 2px solid var(--adag-gold-hi); outline-offset: 3px; }
  .adag-txt { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1 1 280px; }
  .adag-eyebrow { font: 500 12px/1.2 'IBM Plex Mono', 'SF Mono', Menlo, monospace; letter-spacing: .14em; text-transform: uppercase; color: var(--adag-gold); }
  .adag-title { font: 800 30px/1 'Barlow Condensed', 'Arial Narrow', sans-serif; text-transform: uppercase; letter-spacing: .01em; color: var(--adag-cream); }
  .adag-title b { color: var(--adag-gold-hi); font-weight: 800; }
  .adag-sub { font-size: 15px; line-height: 1.45; color: var(--adag-sand); }
  .adag-btn { box-sizing: border-box; display: inline-flex; align-items: center; gap: 8px; flex: none; min-height: 48px; padding: 0 20px; border-radius: 10px;
    background: linear-gradient(180deg, #ebcb6a, #c9a227); color: #1a1408; font-weight: 700; font-size: 16px; white-space: nowrap; }
  @media (max-width: 520px) { .adag-btn { width: 100%; justify-content: center; } .adag-title { font-size: 27px; } }
  @media (prefers-reduced-motion: reduce) { .adag-card { transition: none; } .adag-card:hover { transform: none; } }
</style>
<a class="adag-card" href="URL_DE_ADA_GRUPAL" target="_blank" rel="noopener">
  <span class="adag-txt">
    <span class="adag-eyebrow">Clase grupal · jueves 19 hs</span>
    <span class="adag-title">Dejá tu pregunta para la <b>próxima clase</b></span>

  </span>
  <span class="adag-btn">Dejar mi pregunta <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
</a>
